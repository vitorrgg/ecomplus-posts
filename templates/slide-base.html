<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@1,600&family=Red+Hat+Display:wght@400&display=swap" rel="stylesheet">
<style>
{{TOKENS}}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body {
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 90px;
}
h1 {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
  text-transform: lowercase;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-size: 64px;
  color: var(--color-brand);
  margin-bottom: 32px;
  text-wrap: balance;
}
.texto {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 32px;
  line-height: 1.3;
  color: var(--color-text);
}
.slide-count {
  position: absolute;
  bottom: 60px;
  right: 90px;
  font-family: var(--font-body);
  font-size: 22px;
  color: var(--color-primary);
}
</style>
</head>
<body>
  <h1>{{TITULO}}</h1>
  <p class="texto">{{TEXTO}}</p>
  <span class="slide-count">{{SLIDE_ATUAL}}/{{TOTAL_SLIDES}}</span>
</body>
</html>
