# Geração pela API da Claude (cobrada à parte, precisa do secret ANTHROPIC_API_KEY).
# Só disparo manual: a geração semanal de verdade roda pelo Claude Code (plano Max),
# na rotina agendada na nuvem ou em scripts/ecb/semana-local.sh — ver ecb/README.md.
# Pra voltar a agendar aqui, descomente o bloco `schedule`.
# A publicação no Instagram é o workflow ecb-publicar.yml.
name: ECB — gerar posts pela API (manual)

on:
  # schedule:
  #   - cron: '0 12 * * 1'   # segunda 09:00 em São Paulo (12:00 UTC)
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos artigos do ranking virar post'
        default: '3'

permissions:
  contents: write

concurrency:
  group: ecb
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Coletar, gerar briefs, renderizar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ecb/semana.mjs --via api --limite "${{ github.event.inputs.limite || '3' }}"
      - name: Commit da fila
        run: |
          git config user.name 'ecb-bot'
          git config user.email 'ti@e-com.club'
          git add ecb posts output
          if git diff --cached --quiet; then echo 'nada novo'; exit 0; fi
          git commit -m "feat(ecb): posts da semana $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push
      - name: Aviso no Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_CONTEUDO: ${{ vars.SLACK_CHANNEL_CONTEUDO }}
        run: |
          novos=$(git diff --name-only HEAD~1 HEAD -- posts | cut -d/ -f2 | sort -u | tr '\n' ' ')
          [ -n "$novos" ] && node scripts/ecb/notificar-slack.mjs $novos || echo 'nada novo'
