# Publica o próximo carrossel da fila no Instagram (@ecomplus.io). Seg/qua/sex sai a
# série ecb (os 3 posts dos mais lidos gerados na segunda de manhã) e quinta a série
# do livro (ecb/livro/). As imagens são
# lidas pela API do Instagram direto do raw.githubusercontent.com deste repo,
# por isso a fila precisa estar comitada e enviada antes (ecb-semanal.yml).
name: ECB — publicar no Instagram

on:
  schedule:
    - cron: '0 15 * * 1,3,5'   # seg/qua/sex 12:00 em São Paulo (15:00 UTC): série ecb
    - cron: '0 15 * * 4'       # qui 12:00 em São Paulo: série do livro
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug específico (vazio = próximo da fila)'
        default: ''
      serie:
        description: 'Série quando o slug está vazio'
        type: choice
        options: [ecb, livro]
        default: ecb
      dry_run:
        description: 'Só simular (não chama a API)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ecb
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          ECB_EXIGE_APROVACAO: ${{ vars.ECB_EXIGE_APROVACAO }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_CONTEUDO: ${{ vars.SLACK_CHANNEL_CONTEUDO }}
        run: |
          args=()
          [ -n "${{ github.event.inputs.slug }}" ] && args+=(--slug "${{ github.event.inputs.slug }}")
          serie="${{ github.event.inputs.serie }}"
          if [ -z "$serie" ]; then
            [ "${{ github.event.schedule }}" = '0 15 * * 4' ] && serie=livro || serie=ecb
          fi
          args+=(--serie "$serie")
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          node scripts/ecb/publicar-instagram.mjs "${args[@]}"
      - name: Commit do histórico
        run: |
          git config user.name 'ecb-bot'
          git config user.email 'ti@e-com.club'
          git add ecb
          if git diff --cached --quiet; then echo 'nada mudou'; exit 0; fi
          git commit -m "chore(ecb): registra publicação no Instagram"
          git pull --rebase origin master
          git push
