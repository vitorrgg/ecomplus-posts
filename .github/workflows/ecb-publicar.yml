# Publica o próximo carrossel da fila no Instagram. Seg/qua/sex sai a série ecb no
# @ecomplus.io (os 3 posts dos mais lidos gerados na segunda de manhã) e quinta a série
# do livro (ecb/livro/), como diz ecb/livro/config.json: hoje no @ecomplus.io com o
# @vitorrgg como colaborador (convite aceito pela API com o token dele, por isso os
# segredos IG_VITORRGG_* no passo de publicar). Com "ecomplus" e "vitorrgg" em contas, o
# passo "Livro também no @vitorrgg" faz um segundo post no perfil pessoal. Logo
# depois de cada post, o texto dele (posts/<slug>/linkedin.txt) sai no perfil pessoal do
# Vitor no LinkedIn; se o LinkedIn falhar, o Instagram já foi e o histórico é comitado do
# mesmo jeito. As imagens são
# lidas pela API do Instagram direto do raw.githubusercontent.com deste repo,
# por isso a fila precisa estar comitada e enviada antes (ecb-semanal.yml).
name: ECB — publicar no Instagram

on:
  schedule:
    - cron: '0 15 * * 1,3,5'   # seg/qua/sex 12:00 em São Paulo (15:00 UTC): série ecb
    - cron: '0 15 * * 4'       # qui 12:00 em São Paulo: série do livro
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug específico (vazio = próximo da fila)'
        default: ''
      serie:
        description: 'Série quando o slug está vazio'
        type: choice
        options: [ecb, livro]
        default: ecb
      dry_run:
        description: 'Só simular (não chama a API)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ecb
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Publicar
        id: publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_VITORRGG_USER_ID: ${{ secrets.IG_VITORRGG_USER_ID }}
          IG_VITORRGG_ACCESS_TOKEN: ${{ secrets.IG_VITORRGG_ACCESS_TOKEN }}
          ECB_EXIGE_APROVACAO: ${{ vars.ECB_EXIGE_APROVACAO }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_CONTEUDO: ${{ vars.SLACK_CHANNEL_CONTEUDO }}
        run: |
          args=()
          [ -n "${{ github.event.inputs.slug }}" ] && args+=(--slug "${{ github.event.inputs.slug }}")
          serie="${{ github.event.inputs.serie }}"
          if [ -z "$serie" ]; then
            [ "${{ github.event.schedule }}" = '0 15 * * 4' ] && serie=livro || serie=ecb
          fi
          args+=(--serie "$serie")
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          node scripts/ecb/publicar-instagram.mjs "${args[@]}"
      - name: Publicar no LinkedIn
        if: steps.publicar.outputs.slug != ''
        continue-on-error: true
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR: ${{ vars.LINKEDIN_AUTHOR }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_CONTEUDO: ${{ vars.SLACK_CHANNEL_CONTEUDO }}
        run: node scripts/ecb/publicar-linkedin.mjs --slug "${{ steps.publicar.outputs.slug }}"
      - name: Livro também no @vitorrgg
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          IG_VITORRGG_USER_ID: ${{ secrets.IG_VITORRGG_USER_ID }}
          IG_VITORRGG_ACCESS_TOKEN: ${{ secrets.IG_VITORRGG_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_CONTEUDO: ${{ vars.SLACK_CHANNEL_CONTEUDO }}
        run: node scripts/ecb/publicar-vitorrgg.mjs
      - name: Commit do histórico
        if: always()
        run: |
          git config user.name 'ecb-bot'
          git config user.email 'ti@e-com.club'
          git add ecb
          if git diff --cached --quiet; then echo 'nada mudou'; exit 0; fi
          git commit -m "chore(ecb): registra publicação no Instagram"
          git pull --rebase origin master
          git push
