# Publica o próximo vídeo da fila (videos/fila.json) como Reel no Instagram (@ecomplus.io
# e/ou @vitorrgg) e Short no YouTube (canal da e-com.plus e/ou canal pessoal), conforme os
# destinos do item. Roda de hora em hora e só publica o que já chegou no horário marcado em
# "quando". O Instagram lê o vídeo do raw.githubusercontent.com, então a pasta
# videos/<slug>/ precisa estar na master antes do horário.
name: Vídeos — publicar Reels e Shorts

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug específico (vazio = próximo da fila que já está na hora)'
        default: ''
      dry_run:
        description: 'Só simular (não publica)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
      IG_VITORRGG_USER_ID: ${{ secrets.IG_VITORRGG_USER_ID }}
      IG_VITORRGG_ACCESS_TOKEN: ${{ secrets.IG_VITORRGG_ACCESS_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_VITORRGG_REFRESH_TOKEN: ${{ secrets.YT_VITORRGG_REFRESH_TOKEN }}
      YT_PRIVACIDADE: ${{ vars.YT_PRIVACIDADE }}
      VIDEOS_EXIGE_APROVACAO: ${{ vars.VIDEOS_EXIGE_APROVACAO }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_CONTEUDO: ${{ vars.SLACK_CHANNEL_CONTEUDO }}
    steps:
      # O acervo de vídeos passa de 1 GB e o checkout levava 2 min por rodada,
      # de hora em hora, para publicar um arquivo de 30 MB. Aqui vem só o que
      # decide o que publicar; a pasta do vídeo entra no passo seguinte.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/
            /videos/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # o publicador só usa módulos do Node: sem npm ci, cada rodada leva segundos
      - name: Algo na hora?
        id: hora
        run: |
          args=()
          [ -n "${{ github.event.inputs.slug }}" ] && args+=(--slug "${{ github.event.inputs.slug }}")
          node scripts/videos/publicar.mjs --tem-algo "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Trazer a pasta do vídeo
        if: steps.hora.outputs.tem == 'true' && steps.hora.outputs.slug != ''
        run: |
          slug='${{ steps.hora.outputs.slug }}'
          git sparse-checkout set --no-cone '/scripts/' '/videos/*.json' "/videos/$slug/"
          test -f "videos/$slug/video.mp4" || { echo "::error::videos/$slug/video.mp4 não veio no sparse-checkout"; exit 1; }
          echo "baixado: $(du -sh "videos/$slug" | cut -f1)"
      - name: Publicar
        if: steps.hora.outputs.tem == 'true'
        run: |
          args=()
          [ -n "${{ github.event.inputs.slug }}" ] && args+=(--slug "${{ github.event.inputs.slug }}")
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          node scripts/videos/publicar.mjs "${args[@]}"
      - name: Commit da fila
        if: steps.hora.outputs.tem == 'true' && always()
        run: |
          git config user.name 'ecb-bot'
          git config user.email 'ti@e-com.club'
          git add videos/fila.json videos/historico.json
          if git diff --cached --quiet; then echo 'nada mudou'; exit 0; fi
          git commit -m "chore(videos): registra publicação"
          git pull --rebase origin master
          git push
